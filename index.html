<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Prompt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    #prompt {
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    #toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    #toolbar button {
      color: #fff;
      border: 3px solid transparent;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 1rem;
      cursor: pointer;
    }

    #toolbar button.active {
      outline: 3px solid #fff;
    }

    #btn-brown { background: #795548; }
    #btn-purple { background: #7b1fa2; }
    #btn-eraser { background: #9e9e9e; }
    #btn-clear  { background: #e53935; }

    canvas {
      display: block;
      width: 100%;
      max-width: 800px;
      border: 1px solid #bbb;
      cursor: crosshair;
    }
  </style>
</head>
<body>
</body>
</html>
