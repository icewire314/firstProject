<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Prompt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    #prompt {
      font-size: 1.25rem;
      margin-bottom: 12px;
    }

    #toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    #toolbar button {
      color: #fff;
      border: 3px solid transparent;
      border-radius: 4px;
      padding: 6px 14px;
      font-size: 1rem;
      cursor: pointer;
    }

    #toolbar button.active {
      outline: 3px solid #fff;
    }

    #btn-brown { background: #795548; }
    #btn-purple { background: #7b1fa2; }
    #btn-eraser { background: #9e9e9e; }
    #btn-clear  { background: #e53935; }

    canvas {
      display: block;
      width: 100%;
      max-width: 800px;
      border: 1px solid #bbb;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <h1>Drawing Prompt</h1>
  <div id="prompt"></div>
  <div id="toolbar">
    <button id="btn-brown">Brown</button>
    <button id="btn-purple">Purple</button>
    <button id="btn-eraser">Eraser</button>
    <button id="btn-clear">Clear</button>
  </div>
  <canvas id="canvas" width="800" height="500"></canvas>

  <script>
    const PROMPTS = [
      'a cat', 'a house', 'a tree', 'a rocket', 'a fish',
      'a mountain', 'a sun', 'a car', 'a flower', 'a robot',
      'a bicycle', 'a penguin', 'a dragon', 'a lighthouse', 'a pizza',
      'a castle', 'a cloud', 'a submarine', 'a cactus', 'a butterfly'
    ];

    function getRandomPrompt() {
      return PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
    }

    document.getElementById('prompt').textContent = 'Draw: ' + getRandomPrompt();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let isDrawing = false;
    let lastX = 0;
    let lastY = 0;
    let snapshot = null;
    let activeTool = 'brown';

    const COLORS = { brown: '#795548', purple: '#7b1fa2', eraser: '#fff' };

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function getTouchCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];
      return {
        x: (t.clientX - rect.left) * (canvas.width / rect.width),
        y: (t.clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startStroke(x, y) {
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
      isDrawing = true;
      lastX = x;
      lastY = y;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 8;
      ctx.strokeStyle = COLORS[activeTool];
    }

    function continueStroke(x, y) {
      if (!isDrawing) return;
      const midX = (lastX + x) / 2;
      const midY = (lastY + y) / 2;
      ctx.quadraticCurveTo(lastX, lastY, midX, midY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(midX, midY);
      lastX = x;
      lastY = y;
    }

    function endStroke() {
      if (!isDrawing) return;
      ctx.lineTo(lastX, lastY);
      ctx.stroke();
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', e => { const { x, y } = getCoords(e); startStroke(x, y); });
    canvas.addEventListener('mousemove', e => { const { x, y } = getCoords(e); continueStroke(x, y); });
    canvas.addEventListener('mouseup', endStroke);
    canvas.addEventListener('mouseleave', endStroke);

    canvas.addEventListener('touchstart', e => { e.preventDefault(); const { x, y } = getTouchCoords(e); startStroke(x, y); }, { passive: false });
    canvas.addEventListener('touchmove',  e => { e.preventDefault(); const { x, y } = getTouchCoords(e); continueStroke(x, y); }, { passive: false });
    canvas.addEventListener('touchend',   e => { e.preventDefault(); endStroke(); }, { passive: false });

    function setActiveTool(tool) {
      activeTool = tool;
      document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active'));
      document.getElementById('btn-' + tool).classList.add('active');
    }

    document.getElementById('btn-brown').addEventListener('click',  () => setActiveTool('brown'));
    document.getElementById('btn-purple').addEventListener('click', () => setActiveTool('purple'));
    document.getElementById('btn-eraser').addEventListener('click', () => setActiveTool('eraser'));
    document.getElementById('btn-clear').addEventListener('click', () => {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      snapshot = null;
    });

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'z' && snapshot) {
        ctx.putImageData(snapshot, 0, 0);
        snapshot = null;
      }
    });

    setActiveTool('brown');
  </script>
</body>
</html>
